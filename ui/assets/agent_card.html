<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{color-scheme:light dark;--text:#1e293b;--muted:#526174;--line:#d3dbe5;--panel:#f8fafc;--ok:#087f6b;--warn:#9a5a00;--error:#b42338;--accent:#5c47b6}
@media(prefers-color-scheme:dark){:root{--text:#e2e8f0;--muted:#a2afc0;--line:#364252;--panel:#141c28;--ok:#6ad9c5;--warn:#efc36b;--error:#ff91a2;--accent:#b7a5ff}}
:root[data-theme="dark"]{color-scheme:dark;--text:#e2e8f0;--muted:#a2afc0;--line:#364252;--panel:#141c28;--ok:#6ad9c5;--warn:#efc36b;--error:#ff91a2;--accent:#b7a5ff}
:root[data-theme="light"]{color-scheme:light;--text:#1e293b;--muted:#526174;--line:#d3dbe5;--panel:#f8fafc;--ok:#087f6b;--warn:#9a5a00;--error:#b42338;--accent:#5c47b6}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.strip{height:88px;position:relative;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.header{display:flex;align-items:center;gap:12px;min-width:0;line-height:18px;font-size:12px}.name{font-weight:650;white-space:nowrap}.status{margin-left:auto;color:var(--muted);text-align:right;white-space:nowrap}.status[data-state="warning"]{color:var(--warn)}.status[data-state="error"]{color:var(--error)}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));list-style:none;margin:12px 0 0;padding:0;gap:16px}.stage{position:relative;display:flex;align-items:center;gap:6px;min-width:0;color:var(--muted);font-size:12px;line-height:20px}.stage:not(:last-child)::after{content:"";width:8px;height:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);position:absolute;right:-9px;top:6px;transform:rotate(45deg)}
.mark{display:inline-flex;align-items:center;justify-content:center;flex:0 0 18px;width:18px;height:18px;border:1px solid currentColor;border-radius:50%;font-size:12px;font-weight:650;line-height:1}.stage[data-state="ok"] .mark{color:var(--ok)}.stage[data-state="warning"] .mark{color:var(--warn)}.stage[data-state="error"] .mark{color:var(--error)}.stage[data-state="running"] .mark{color:var(--accent)}.stage[data-state="pending"] .mark,.stage[data-state="skip"] .mark{border-style:dashed}.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* One completion acknowledgement; every stage is already shown in its real final state. */
.strip.ack::after{content:"";position:absolute;pointer-events:none;inset:0;background:linear-gradient(100deg,transparent 25%,color-mix(in srgb,var(--ok) 12%,transparent) 50%,transparent 75%);transform:translateX(-110%);animation:wa-ack 1.05s ease-out 1 both}
@keyframes wa-ack{0%{transform:translateX(-110%);opacity:0}15%{opacity:1}100%{transform:translateX(110%);opacity:0}}
@media(max-width:420px){.strip{padding:10px 12px;height:108px}.header{gap:6px;font-size:11px}.stages{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:9px;gap:7px 20px}.stage{font-size:12px;gap:7px}.stage:not(:last-child)::after{display:none}.stage:nth-child(odd)::after{display:block;right:-8px;width:6px;height:6px;top:7px}.mark{width:18px;height:18px;flex-basis:18px}}
@media(prefers-reduced-motion:reduce){.strip.ack::after{animation:none;display:none}}
</style>
</head>
<body>
<section class="strip" id="strip" aria-label="Ход расчёта WindAgent">
  <div class="header"><span class="name">Агент WindAgent</span><span class="status" id="status" role="status">Ожидает расчёта</span></div>
  <ol class="stages" id="stages"></ol>
</section>
<script>
(function () {
  'use strict';
  var D = /*__WA_CARD_DATA__*/null;
  D = D || {};
  if (D.theme === 'light' || D.theme === 'dark') document.documentElement.dataset.theme = D.theme;
  var groups = D.mode === 'study' ? [
    ['Атлас', ['атлас']], ['Ресурс', ['ERA5']], ['Прогноз', ['прогноз']], ['Проверка', ['рельеф', 'отчёт']]
  ] : [
    ['Погода', ['fetch_weather']], ['Данные', ['prepare_data', 'recalculate']],
    ['Прогноз', ['run_model']], ['Проверка', ['analyze_forecast', 'llm', 'verify_narrative', 'write_report']]
  ];
  var aliases = {done:'ok',success:'ok',completed:'ok',skipped:'skip',run:'running',failed:'error',warn:'warning'};
  var labels = {ok:'готово',pending:'ожидает',skip:'пропущено',running:'в работе',warning:'есть ограничения',error:'ошибка'};
  var marks = {ok:'✓',pending:'·',skip:'−',running:'…',warning:'!',error:'×'};
  var latest = {};
  (D.steps || []).forEach(function(s) { latest[s.tool] = aliases[s.status] || s.status || 'pending'; });
  function stageState(tools) {
    var values = tools.filter(function(t) {return Object.prototype.hasOwnProperty.call(latest,t);}).map(function(t){return latest[t];});
    if (!values.length) return 'pending';
    for (var i=0;i<5;i++) {var state=['error','running','warning','pending','skip'][i]; if(values.indexOf(state)>=0)return state;}
    return values.every(function(s){return s==='ok';}) ? 'ok' : 'pending';
  }
  var states = [];
  groups.forEach(function(group){
    var state = stageState(group[1]); states.push(state);
    var item = document.createElement('li'); item.className='stage'; item.dataset.state=state;
    var mark = document.createElement('span'); mark.className='mark'; mark.setAttribute('aria-hidden','true'); mark.textContent=marks[state];
    var label = document.createElement('span'); label.className='label'; label.textContent=group[0];
    var sr = document.createElement('span'); sr.className='sr-only'; sr.textContent=': '+labels[state];
    item.title=group[0]+': '+labels[state]; item.appendChild(mark);item.appendChild(label);item.appendChild(sr);
    document.getElementById('stages').appendChild(item);
  });
  var decision = (D.decision || {}).code || 'idle';
  var severity = states.indexOf('error')>=0 || ['error','recalculate'].indexOf(decision)>=0 ? 'error' :
    states.indexOf('running')>=0 ? 'running' :
    states.some(function(s){return ['warning','skip'].indexOf(s)>=0;}) || ['warning','flag'].indexOf(decision)>=0 ? 'warning' :
    states.indexOf('pending')>=0 ? 'pending' : 'ready';
  var text = {ready:'Расчёт готов',warning:'Есть ограничения',error:'Нужна проверка',running:'Идёт расчёт',pending:'Ожидает расчёта'};
  var status = document.getElementById('status'); status.dataset.state=severity;status.textContent=text[severity];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var key = D.key ? 'wa-card-'+D.key : null, seen = false;
  try {seen=!!(key && window.sessionStorage.getItem(key));} catch(e) {seen=true;}
  // Never animate initial rendering, incomplete runs, unknown keys or a rerender of the same action.
  if (D.animate === true && key && !seen && !reduce && severity !== 'pending' && severity !== 'running') {
    try {window.sessionStorage.setItem(key,'1');} catch(e) {return;}
    document.getElementById('strip').classList.add('ack');
  }
}());
</script>
</body>
</html>
