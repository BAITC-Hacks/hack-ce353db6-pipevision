[project]
name = "wind-agent"
version = "0.1.0"
description = "Agentic AI для почасового прогноза выработки ВЭС на 24–48 часов (HackAlem AI 2026, трек «Энергетика», кейс Самрук-Казына)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "requests>=2.32",
    "joblib>=1.4",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.38"]   # панель оператора ui/app.py (make setup-ui), altair идёт вместе со streamlit

[project.scripts]
wind-agent = "wind_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wind_agent"]
